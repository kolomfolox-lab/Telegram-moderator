services:
  - type: web
    name: telegram-moderator
    runtime: python
    repo: https://github.com/kolomfolox-lab/Telegram-moderator
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CHAT_USERNAME
        value: "@isitish_qozonlari"
      - key: GROQ_MODEL
        value: "llama-3.1-8b-instant"
      - key: SPAM_CONFIDENCE_THRESHOLD
        value: "0.2"
      - key: ADMIN_USERNAMES
        value: "Dilshod_Eshmurodov,cesicu"
